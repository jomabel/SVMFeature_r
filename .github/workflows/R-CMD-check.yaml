name: R-CMD-check (Linux)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
  R_KEEP_PKG_SOURCE: "yes"
  _R_CHECK_FORCE_SUGGESTS_: "true"
  _R_CHECK_CRAN_INCOMING_: "true"
  _R_CHECK_CRAN_INCOMING_REMOTE_: "true"

jobs:
  build:
    name: Build source package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          Ncpus: 2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Build the source archive and vignette
        run: R CMD build .

      - name: Upload the source archive
        uses: actions/upload-artifact@v7.0.2
        with:
          name: source-package
          path: svmfsmeta_*.tar.gz
          if-no-files-found: error

  check:
    name: Ubuntu (R-${{ matrix.r }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        r: [release, devel]
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          http-user-agent: release
          Ncpus: 2

      - uses: r-lib/actions/setup-tinytex@v2

      - name: Install manual fonts and index tools
        run: |
          tlmgr install courier makeindex
          tlmgr path add
          kpsewhich pcrr8t.tfm
          command -v makeindex

      - name: Install HTML validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y tidy

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::V8
          needs: check
          cache: always

      - name: Download the shared source archive
        uses: actions/download-artifact@v8.0.2
        with:
          name: source-package
          path: source-package

      - name: Check the package, tests, vignette and PDF manual
        shell: Rscript {0}
        run: |
          archive <- list.files("source-package", pattern = "[.]tar[.]gz$", full.names = TRUE)
          stopifnot(length(archive) == 1L)
          rcmdcheck::rcmdcheck(
            path = archive,
            args = "--as-cran",
            check_dir = "check",
            error_on = "warning"
          )

      - name: Upload check results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: linux-r-${{ matrix.r }}-check
          path: check
          if-no-files-found: ignore
